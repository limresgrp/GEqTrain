# @package _global_
defaults:
  - /model/stack_blocks: common
  - _self_

model:
  stack:
    - ${stack_blocks.node_input_attrs}
    - ${stack_blocks.graph_input_attrs}
    - ${stack_blocks.edge_radial_attrs}
    - ${stack_blocks.edge_angular_attrs}
    - _target_: geqtrain.nn.EmbeddingAttrs
      name: attrs
      node_out_irreps: 512x0e
      edge_out_irreps: 512x0e
      edge_eq_out_irreps: 8x1o+8x2e
      edge_emb_kwargs:
        include_edge_field: true
        include_edge_radial: true
      edge_eq_emb_kwargs:
        include_edge_eq_field: true
        include_edge_spharm: true
    - _target_: geqtrain.nn.InteractionModule
      name: interaction
      num_layers: 2
      latent_dim: 512
      eq_latent_multiplicity: 8
      use_attention: true
      attention_mode: node_feature_query
      attention_head_dim: 64
      node_state_field: node_attention_features
      node_state_pooling: attention
      node_state_use_residual: true
      use_mace_product: false
      output_ls: [0, 1, 2]
      residual_update_max: 1.0
      attention_logit_clip: 10.0
      use_equivariant_residual: true
      latent_module: geqtrain.nn.ScalarMLPFunction
      latent_module_kwargs:
        mlp_latent_dimensions: [1024]
        mlp_nonlinearity: silu
    - _target_: geqtrain.nn.EdgewiseReduce
      name: edge_pooling
      field: edge_features
      out_field: node_features
      use_attention: true
      avg_num_neighbors: ${avg_num_neighbors}
    - _target_: geqtrain.nn.ReadoutModule
      name: head_cs_iso
      field: node_features
      out_field: cs_iso
      out_irreps: 1x0e
      strict_irreps: false
      readout_latent: geqtrain.nn.ScalarMLPFunction
      readout_latent_kwargs:
        mlp_latent_dimensions: [1024]
        mlp_nonlinearity: silu
        wd: true
    - _target_: geqtrain.nn.ReadoutModule
      name: head_cs_tensor
      field: node_features
      out_field: cs_tensor
      out_irreps: 1x1o+1x2e
      strict_irreps: false
      readout_latent: geqtrain.nn.ScalarMLPFunction
      readout_latent_kwargs:
        mlp_latent_dimensions: [1024]
        mlp_nonlinearity: silu
        wd: true

r_max: 6.0
num_basis: 16
l_max: 2
parity: o3_full
head_wds: 1e-6

# -------- #
#  Inputs  #
# -------- #

node_attributes:
  node_types: {}
  atom_rows:
    embedding_mode: one_hot
    num_types: 5
  atom_cols:
    embedding_mode: one_hot
    num_types: 18

eq_node_attributes: {}
