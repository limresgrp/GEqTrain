# @package _global_

defaults:
  - /model/stack_blocks: common
  - _self_

model:
  stack:
    - ${stack_blocks.node_input_attrs}
    - ${stack_blocks.edge_radial_attrs}
    - ${stack_blocks.edge_angular_attrs}
    - _target_: geqtrain.nn.EmbeddingAttrs
      name: attrs
      node_out_irreps: 16x0e
      edge_out_irreps: 16x0e
      edge_eq_out_irreps: 2x1o+2x2e
      edge_emb_kwargs:
        include_edge_radial: true
      edge_eq_emb_kwargs:
        include_edge_spharm: true
    - _target_: geqtrain.nn.InteractionModule
      name: interaction
      num_layers: 1
      latent_dim: 16
      eq_latent_multiplicity: 2
      use_attention: false
      use_mace_product: false
      output_ls: [0, 1, 2]
      latent_module: geqtrain.nn.ScalarMLPFunction
      latent_module_kwargs:
        mlp_latent_dimensions: [16]
        mlp_nonlinearity: silu
    - _target_: geqtrain.nn.EdgewiseReduce
      name: edge_pooling
      field: edge_features
      out_field: node_features
      use_attention: false

r_max: 5.0
num_basis: 8
l_max: 2
parity: o3_full
irreps_edge_sh: null

node_attributes:
  node_types:
    embedding_mode: one_hot
    num_types: 4
num_types: 4
eq_node_attributes: {}
edge_attributes: {}
eq_edge_attributes: {}
graph_attributes: {}
eq_graph_attributes: {}
